name: flowsure
services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      mired:
        ipv4_address: 172.20.0.25
    hostname: landing-flowsure
    ports:
      - 127.0.0.1:7005:80
    environment:
      - TZ=America/Santiago
    labels:
      # externo
      - traefik.http.routers.flowsure.rule=Host(`flowsure.dev3.prosys.cl`)
      - traefik.http.routers.flowsure.tls.certresolver=myresolver
      - traefik.http.routers.flowsure.entryPoints=web,websecure
      - traefik.http.services.flowsure.loadbalancer.server.port=80

      # interno
      - traefik.http.routers.flowsure-vpn.rule=Host(`flowsure.dev3.prosys.chl`)
      - traefik.http.routers.flowsure-vpn.tls=true
      - traefik.http.routers.flowsure-vpn.entryPoints=web,websecure

      - com.centurylinklabs.watchtower.enable=true
      - cl.prosys.flowsure=true
      - io.portainer.accesscontrol.teams=flowsure
    image: flowsure-landing:latest
networks:
  mired:
    external: true